<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produto — Noémia Store</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f6f6f6;color:#171717;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:20px auto;padding:16px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 24px #0001}.photo{width:100%;height:min(55vh,440px);object-fit:contain;background:#fafafa;border-radius:12px}h1{font-size:27px}.desc{white-space:pre-wrap;line-height:1.7;color:#555}.price{font-size:25px;font-weight:800;margin:18px 0}.btn{width:100%;padding:16px;border:0;border-radius:12px;background:#ef3d79;color:#fff;font-weight:800;font-size:16px;cursor:pointer;animation:pulse 2s infinite}@keyframes pulse{50%{box-shadow:0 6px 22px #ef3d7966;transform:translateY(-1px)}}a{color:inherit}</style></head><body><main class="wrap"><p><a href="./">← Voltar à loja</a></p><article class="card" id="product"><p>A carregar produto…</p></article></main><script>const db=window.supabase.createClient("https://yjqubmdcidqnodmofywy.supabase.co","sb_publishable_wtnoh3Ps8y-_Hw7q4-lp5Q_BfwqTED4");const id=new URLSearchParams(location.search).get("id");const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));(async()=>{try{const {data,error}=await db.from("products").select("*").eq("id",id).single();if(error)throw error;const p={id:data.id,name:data.name||data.title,desc:data.description||data.desc||data.descricao||"Sem descrição disponível.",price:Number(data.price??data.preco??0),image:data.image_url||data.image||data.photo||data.imagem||""};document.title=p.name+" — Noémia Store";document.getElementById("product").innerHTML=`<img class="photo" src="${esc(p.image)}" alt="${esc(p.name)}"><h1>${esc(p.name)}</h1><div class="desc">${esc(p.desc)}</div><div class="price">${p.price.toLocaleString("pt-PT")} Kz</div><button class="btn" id="add">Adicionar ao carrinho</button><p id="status" aria-live="polite"></p>`;document.getElementById("add").onclick=()=>{const cart=JSON.parse(localStorage.getItem("ns_cart")||"{}");cart[p.id]=(cart[p.id]||0)+1;localStorage.setItem("ns_cart",JSON.stringify(cart));document.getElementById("status").textContent="Produto adicionado ao carrinho! Pode voltar à loja para finalizar pelo WhatsApp."}}catch(e){document.getElementById("product").innerHTML="Não foi possível carregar este produto. Volte à loja e tente novamente.";console.error(e)}})();</script></body></html>
