<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administração — Noémia Store</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f5f6f8;color:#222;margin:0;padding:18px}
main{max-width:760px;margin:auto}.card{background:#fff;padding:18px;border-radius:14px;margin:14px 0;box-shadow:0 2px 12px #0001}
input,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;font:inherit}
button{background:#191919;color:#fff;border:0;font-weight:bold;cursor:pointer}.secondary{background:#eee;color:#222}.danger{background:#a22}
.hidden{display:none}.status{padding:12px;border-radius:8px;margin:10px 0;background:#eef2f7}.ok{background:#e8f8ed;color:#176b35}.err{background:#ffe8e8;color:#900}
.item{display:flex;gap:12px;align-items:center;border-bottom:1px solid #eee;padding:12px 0}.item img{width:64px;height:64px;object-fit:cover;border-radius:8px}.grow{flex:1}
</style>
</head>
<body>
<main>
<h1>Gestor de produtos — Noémia Store</h1>
<div id="boot" class="status">A iniciar o painel…</div>

<section id="loginBox" class="card">
<h2>Entrar</h2>
<form id="loginForm">
<label>Email</label><input id="email" type="email" required autocomplete="username">
<label>Senha</label><input id="password" type="password" required autocomplete="current-password">
<button id="loginBtn" type="submit">Entrar no painel</button>
</form>
<div id="loginMsg" class="status">O botão de entrada está pronto.</div>
</section>

<section id="panel" class="hidden">
<div class="card">
<div style="display:flex;gap:10px;align-items:center;justify-content:space-between"><h2>Produtos</h2><button id="logout" class="secondary" style="width:auto">Sair</button></div>
<form id="productForm">
<input type="hidden" id="productId">
<label>Nome</label><input id="name" required>
<label>Categoria</label><input id="category" required>
<label>Preço (Kz)</label><input id="price" type="number" min="0" step="0.01" required>
<label>Descrição</label><textarea id="description" rows="3"></textarea>
<label>Fotografia</label><input id="imageFile" type="file" accept="image/*">
<div id="imageStatus">Imagem opcional.</div>
<label><input id="inStock" type="checkbox" checked style="width:auto"> Disponível</label>
<button id="saveBtn" type="submit">Guardar produto</button>
<button id="clearBtn" type="button" class="secondary">Limpar</button>
</form>
</div>
<div class="card"><h2>Catálogo atual</h2><div id="productList">A carregar…</div></div>
</section>
</main>

<script>
(function(){
'use strict';
const SUPABASE_URL='https://yjqubmdcidqnodmofywy.supabase.co';
const SUPABASE_KEY='sb_publishable_wtnoh3Ps8y-_Hw7q4-lp5Q_BfwqTED4';
let db=null, products=[], currentImage='';

const $=id=>document.getElementById(id);
function status(text,kind){
  const el=$('loginMsg'); el.textContent=text; el.className='status '+(kind||'');
}
function boot(text,kind){
  const el=$('boot'); el.textContent=text; el.className='status '+(kind||'');
}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function initClient(){
  if(!window.supabase) throw new Error('A biblioteca do Supabase não carregou. Verifique a internet e recarregue.');
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  boot('Supabase carregado. Painel pronto.','ok');
}

async function login(e){
  e.preventDefault();
  const btn=$('loginBtn'); btn.disabled=true; btn.textContent='A entrar…';
  status('Clique recebido. A contactar o Supabase…');
  try{
    const email=$('email').value.trim(), password=$('password').value;
    if(!email||!password) throw new Error('Preencha o email e a senha.');
    const {data,error}=await db.auth.signInWithPassword({email,password});
    if(error) throw error;
    if(!data.session) throw new Error('O Supabase não criou uma sessão para este utilizador.');
    status('Login realizado com sucesso. A abrir o painel…','ok');
    $('loginBox').classList.add('hidden'); $('panel').classList.remove('hidden');
    await loadProducts();
  }catch(err){
    console.error(err);
    status('ERRO: '+(err?.message||String(err)),'err');
  }finally{btn.disabled=false;btn.textContent='Entrar no painel';}
}

async function loadProducts(){
  $('productList').textContent='A carregar produtos…';
  const {data,error}=await db.from('products').select('*').order('created_at',{ascending:false});
  if(error){$('productList').innerHTML='<div class="status err">Erro ao carregar produtos: '+esc(error.message)+'</div>';return;}
  products=data||[];
  $('productList').innerHTML=products.length?products.map(p=>`<div class="item"><img src="${esc(p.image_url||'')}" alt=""><div class="grow"><b>${esc(p.name)}</b><div>${esc(p.category)} · ${Number(p.price||0).toLocaleString('pt-PT')} Kz</div><small>${p.in_stock?'Disponível':'Esgotado'}</small></div><button style="width:auto" onclick="editProduct('${esc(p.id)}')">Editar</button><button class="danger" style="width:auto" onclick="deleteProduct('${esc(p.id)}')">Apagar</button></div>`).join(''):'Ainda não existem produtos.';
}

window.editProduct=function(id){
 const p=products.find(x=>String(x.id)===String(id)); if(!p)return;
 $('productId').value=p.id;$('name').value=p.name||'';$('category').value=p.category||'';$('price').value=p.price||0;$('description').value=p.description||'';$('inStock').checked=!!p.in_stock;currentImage=p.image_url||'';$('imageStatus').textContent=currentImage?'Imagem atual mantida se não escolher outra.':'Sem imagem.';
 window.scrollTo({top:0,behavior:'smooth'});
};
window.deleteProduct=async function(id){
 if(!confirm('Apagar este produto?'))return;
 const {error}=await db.from('products').delete().eq('id',id);
 if(error) alert('Erro: '+error.message); else await loadProducts();
};

$('loginForm').addEventListener('submit',login);
$('logout').addEventListener('click',async()=>{await db.auth.signOut();location.reload();});
$('clearBtn').addEventListener('click',()=>{$('productForm').reset();$('productId').value='';$('inStock').checked=true;currentImage='';$('imageStatus').textContent='Imagem opcional.';});
$('productForm').addEventListener('submit',async e=>{
 e.preventDefault(); $('saveBtn').disabled=true;
 try{
  let imageUrl=currentImage, file=$('imageFile').files[0];
  if(file){
   const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
   const path=crypto.randomUUID()+'.'+ext;
   const up=await db.storage.from('product-images').upload(path,file,{upsert:false,contentType:file.type});
   if(up.error)throw up.error;
   imageUrl=db.storage.from('product-images').getPublicUrl(path).data.publicUrl;
  }
  const payload={name:$('name').value.trim(),category:$('category').value.trim(),price:Number($('price').value),description:$('description').value.trim(),image_url:imageUrl,in_stock:$('inStock').checked,updated_at:new Date().toISOString()};
  const id=$('productId').value;
  const result=id?await db.from('products').update(payload).eq('id',id):await db.from('products').insert(payload);
  if(result.error)throw result.error;
  alert('Produto guardado!');
  $('clearBtn').click(); await loadProducts();
 }catch(err){alert('Erro: '+(err?.message||String(err)));console.error(err)}
 finally{$('saveBtn').disabled=false;}
});

window.addEventListener('error',e=>boot('ERRO DE JAVASCRIPT: '+e.message,'err'));
window.addEventListener('unhandledrejection',e=>boot('ERRO: '+(e.reason?.message||String(e.reason)),'err'));

(async function start(){
 try{
  boot('A verificar o JavaScript…');
  initClient();
  const {data,error}=await db.auth.getSession();
  if(error)throw error;
  if(data.session){
   $('loginBox').classList.add('hidden');$('panel').classList.remove('hidden');status('Sessão existente encontrada.','ok');await loadProducts();
  }else status('Nenhuma sessão ativa. Digite o email e a senha.');
 }catch(err){console.error(err);boot('FALHA AO INICIAR: '+(err?.message||String(err)),'err');status('FALHA AO INICIAR: '+(err?.message||String(err)),'err');}
})();
})();
</script>
</body>
</html>
