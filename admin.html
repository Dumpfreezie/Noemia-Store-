<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração — Noémia Store</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;background:#f5f6f8;color:#222;margin:0;padding:18px}main{max-width:760px;margin:auto}.card{background:#fff;padding:18px;border-radius:14px;margin:14px 0;box-shadow:0 2px 12px #0001}input,textarea,button{font:inherit;box-sizing:border-box;width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:6px 0 12px}button{background:#191919;color:#fff;border:0;font-weight:bold;cursor:pointer}.secondary{background:#eee;color:#222}.danger{background:#a22}.item{display:flex;align-items:center;gap:12px;border-bottom:1px solid #eee;padding:12px 0}.item img{width:64px;height:64px;object-fit:cover;border-radius:8px}.item .info{flex:1}.item button{width:auto;padding:9px}.muted{color:#666;font-size:13px}.hidden{display:none}.notice{background:#fff4d6;padding:12px;border-radius:8px}.error{background:#ffe8e8;color:#900;padding:12px;border-radius:8px}.ok{background:#e8f8ed;color:#176b35;padding:12px;border-radius:8px}</style></head><body><main><h1>Gestor de produtos — Noémia Store</h1><p class="notice">Entre com o utilizador criado no Supabase. Se houver erro, ele será mostrado aqui.</p><section class="card" id="loginBox"><h2>Entrar</h2><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="username" placeholder="seu@email.com"><label>Senha</label><input id="password" type="password" required autocomplete="current-password" placeholder="Senha"><button id="loginBtn" type="submit">Entrar no painel</button></form><div id="loginMsg" class="muted"></div></section><section id="panel" class="hidden"><section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Produtos</h2><button id="logout" class="secondary" style="width:auto">Sair</button></div><form id="productForm"><input type="hidden" id="productId"><label>Nome</label><input id="name" required><label>Categoria</label><input id="category" required><label>Preço (Kz)</label><input id="price" type="number" min="0" step="0.01" required><label>Descrição</label><textarea id="description" rows="3"></textarea><label>Fotografia</label><input id="imageFile" type="file" accept="image/*"><p class="muted" id="imageStatus">Imagem opcional.</p><label><input id="inStock" type="checkbox" checked style="width:auto"> Disponível</label><button id="saveBtn" type="submit">Guardar produto</button><button type="button" id="clearBtn" class="secondary">Limpar</button></form></section><section class="card"><h2>Catálogo actual</h2><div id="productList">A carregar…</div></section></section></main><script>const URL="https://yjqubmdcidqnodmofywy.supabase.co",KEY="sb_publishable_wtnoh3Ps8y-_Hw7q4-lp5Q_BfwqTED4";let db,currentImage="",cache=[];const $=id=>document.getElementById(id);function msg(t,ok=false){$("loginMsg").className=ok?"ok":"error";$("loginMsg").textContent=t}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function showPanel(){$("loginBox").classList.add("hidden");$("panel").classList.remove("hidden");loadProducts()}async function login(e){e.preventDefault();$("loginBtn").disabled=true;$("loginBtn").textContent="A entrar…";msg("A verificar…",true);try{if(!window.supabase)throw new Error("Supabase não carregou. Verifica a internet e recarrega a página.");db=window.supabase.createClient(URL,KEY);const email=$("email").value.trim(),password=$("password").value;if(!email||!password)throw new Error("Preencha o email e a senha.");const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;if(!data.session)throw new Error("Login não criou uma sessão. Confirma se o utilizador existe no Supabase.");showPanel()}catch(err){console.error(err);msg("Não foi possível entrar: "+(err?.message||String(err)))}finally{$("loginBtn").disabled=false;$("loginBtn").textContent="Entrar no painel"}}async function loadProducts(){const {data,error}=await db.from("products").select("*").order("created_at",{ascending:false});if(error){$("productList").innerHTML='<div class="error">Erro ao carregar produtos: '+esc(error.message)+'</div>';return}cache=data||[];$("productList").innerHTML=cache.map(p=>'<div class="item"><img src="'+esc(p.image_url||"")+'" alt=""><div class="info"><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.category)+' · '+Number(p.price).toLocaleString("pt-PT")+' Kz · '+(p.in_stock?"Disponível":"Esgotado")+'</div></div><button class="secondary" onclick="editProduct(\''+p.id+'\')">Editar</button><button class="danger" onclick="deleteProduct(\''+p.id+'\')">Apagar</button></div>').join("")||"Ainda não existem produtos."}window.editProduct=id=>{const p=cache.find(x=>String(x.id)===String(id));if(!p)return;$("productId").value=p.id;$("name").value=p.name;$("category").value=p.category;$("price").value=p.price;$("description").value=p.description||"";$("inStock").checked=!!p.in_stock;currentImage=p.image_url||"";$("imageStatus").textContent="Imagem actual será mantida se não escolher outra.";scrollTo({top:0,behavior:"smooth"})};window.deleteProduct=async id=>{if(!confirm("Apagar este produto?"))return;const {error}=await db.from("products").delete().eq("id",id);if(error)alert(error.message);else loadProducts()};$("loginForm").addEventListener("submit",login);$("logout").onclick=async()=>{await db.auth.signOut();location.reload()};$("clearBtn").onclick=()=>{$("productForm").reset();$("productId").value="";currentImage="";$("inStock").checked=true};$("productForm").addEventListener("submit",async e=>{e.preventDefault();$("saveBtn").disabled=true;try{let imageUrl=currentImage,file=$("imageFile").files[0];if(file){const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";const path=crypto.randomUUID()+"."+ext;const {error}=await db.storage.from("product-images").upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;imageUrl=db.storage.from("product-images").getPublicUrl(path).data.publicUrl}const payload={name:$("name").value.trim(),category:$("category").value.trim(),description:$("description").value.trim(),price:Number($("price").value),image_url:imageUrl,in_stock:$("inStock").checked,updated_at:new Date().toISOString()};const id=$("productId").value;const result=id?await db.from("products").update(payload).eq("id",id):await db.from("products").insert(payload);if(result.error)throw result.error;$("productForm").reset();$("productId").value="";currentImage="";await loadProducts();alert("Produto guardado!")}catch(err){alert("Erro: "+err.message)}finally{$("saveBtn").disabled=false}});window.addEventListener("load",async()=>{try{if(!window.supabase){msg("Supabase não carregou. Recarregue com internet.");return}db=window.supabase.createClient(URL,KEY);const {data}=await db.auth.getSession();if(data.session)showPanel()}catch(e){console.error(e);msg("Erro ao iniciar: "+e.message)}});</script></body></html>
