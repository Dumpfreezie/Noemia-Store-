<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração — Noémia Store</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;background:#f5f6f8;color:#222;margin:0;padding:18px}main{max-width:760px;margin:auto}.card{background:#fff;padding:18px;border-radius:14px;margin:14px 0;box-shadow:0 2px 12px #0000000c}input,textarea,button{font:inherit;box-sizing:border-box;width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:6px 0 12px}button{background:#191919;color:white;border:0;font-weight:bold;cursor:pointer}.secondary{background:#eee;color:#222}.danger{background:#a22}.item{display:flex;align-items:center;gap:12px;border-bottom:1px solid #eee;padding:12px 0}.item img{width:64px;height:64px;object-fit:cover;border-radius:8px}.item .info{flex:1}.item button{width:auto;padding:9px}.muted{color:#666;font-size:13px}.hidden{display:none}.notice{background:#fff4d6;padding:12px;border-radius:8px}</style></head><body><main><h1>Gestor de produtos — Noémia Store</h1><p class="notice">Acede com o email e a senha de administrador criados no Supabase. As alterações são gravadas directamente na loja online.</p><section class="card" id="loginBox"><h2>Entrar</h2><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Senha</label><input id="password" type="password" required autocomplete="current-password"><button>Entrar no painel</button></form><p id="loginMsg" class="muted"></p></section><section id="panel" class="hidden"><section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Produtos</h2><button id="logout" class="secondary" style="width:auto">Sair</button></div><form id="productForm"><input type="hidden" id="productId"><label>Nome</label><input id="name" required><label>Categoria</label><input id="category" required placeholder="Telemóveis, Computadores, Acessórios"><label>Preço (Kz)</label><input id="price" type="number" min="0" step="0.01" required><label>Descrição</label><textarea id="description" rows="3"></textarea><label>Fotografia do produto</label><input id="imageFile" type="file" accept="image/*"><p class="muted" id="imageStatus">Escolhe uma imagem para carregar (opcional).</p><label><input id="inStock" type="checkbox" checked style="width:auto"> Disponível para venda</label><button id="saveBtn">Guardar produto</button><button type="button" id="clearBtn" class="secondary">Limpar formulário</button></form></section><section class="card"><h2>Catálogo actual</h2><div id="productList">A carregar…</div></section></section></main><script>
const URL="https://yjqubmdcidqnodmofywy.supabase.co",KEY="sb_publishable_wtnoh3Ps8y-_Hw7q4-lp5Q_BfwqTED4",db=window.supabase.createClient(URL,KEY);let currentImage="";const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function sessionCheck(){const {data}=await db.auth.getSession();if(data.session)showPanel();}function showPanel(){$("loginBox").classList.add("hidden");$("panel").classList.remove("hidden");loadProducts()}async function loadProducts(){const {data,error}=await db.from("products").select("*").order("created_at",{ascending:false});if(error){$("productList").textContent="Erro: "+error.message;return}$("productList").innerHTML=(data||[]).map(p=>`<div class="item"><img src="${esc(p.image_url||"")}" alt=""><div class="info"><b>${esc(p.name)}</b><div class="muted">${esc(p.category)} · ${Number(p.price).toLocaleString("pt-PT")} Kz · ${p.in_stock?"Disponível":"Esgotado"}</div></div><button class="secondary" onclick="editProduct('${p.id}')">Editar</button><button class="danger" onclick="deleteProduct('${p.id}')">Apagar</button></div>`).join("")||"Ainda não existem produtos.";window.productsCache=data||[]}
window.editProduct=id=>{const p=window.productsCache.find(x=>x.id===id);if(!p)return;$('productId').value=p.id;$('name').value=p.name;$('category').value=p.category;$('price').value=p.price;$('description').value=p.description||"";$('inStock').checked=p.in_stock;$('imageStatus').textContent="Se não escolheres outra imagem, a imagem actual será mantida.";currentImage=p.image_url||"";window.scrollTo({top:0,behavior:"smooth"})};window.deleteProduct=async id=>{if(!confirm("Tens a certeza de que queres apagar este produto?"))return;const {error}=await db.from("products").delete().eq("id",id);if(error)alert(error.message);else loadProducts()};
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginMsg').textContent="A verificar…";const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginMsg').textContent="Não foi possível entrar: "+error.message;return}showPanel()});$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};$('clearBtn').onclick=()=>{$('productForm').reset();$('productId').value="";currentImage="";$('imageStatus').textContent="Escolhe uma imagem para carregar (opcional)."};
$('productForm').addEventListener('submit',async e=>{e.preventDefault();$('saveBtn').disabled=true;$('saveBtn').textContent="A guardar…";try{let imageUrl=currentImage;const file=$('imageFile').files[0];if(file){if(!file.type.startsWith('image/'))throw new Error('Escolhe um ficheiro de imagem.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path=crypto.randomUUID()+'.'+ext;const {error:upErr}=await db.storage.from('product-images').upload(path,file,{upsert:false,contentType:file.type});if(upErr)throw upErr;const {data:urlData}=db.storage.from('product-images').getPublicUrl(path);imageUrl=urlData.publicUrl}
const payload={name:$('name').value.trim(),category:$('category').value.trim(),description:$('description').value.trim(),price:Number($('price').value),image_url:imageUrl,in_stock:$('inStock').checked,updated_at:new Date().toISOString()};const id=$('productId').value;const result=id?await db.from('products').update(payload).eq('id',id):await db.from('products').insert(payload);if(result.error)throw result.error;$('productForm').reset();$('productId').value="";currentImage="";$('inStock').checked=true;$('imageStatus').textContent="Escolhe uma imagem para carregar (opcional).";await loadProducts();alert('Produto guardado! A loja pública será actualizada ao recarregar.')}catch(err){alert('Erro: '+err.message)}finally{$('saveBtn').disabled=false;$('saveBtn').textContent="Guardar produto"}});sessionCheck();
</script></body></html>
