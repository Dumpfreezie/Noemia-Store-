<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Administração — Noémia Store</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#f5f6f8;color:#222;margin:0;padding:18px}main{max-width:760px;margin:auto}.card{background:#fff;padding:18px;border-radius:14px;margin:14px 0;box-shadow:0 2px 12px #0001}input,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;font:inherit}button{background:#191919;color:#fff;border:0;font-weight:bold;cursor:pointer}.secondary{background:#eee;color:#222}.hidden{display:none}.status{padding:12px;border-radius:8px;margin:10px 0;background:#eef2f7}.ok{background:#e8f8ed;color:#176b35}.err{background:#ffe8e8;color:#900}</style></head><body><main><h1>Gestor de produtos — Noémia Store</h1><div id="boot" class="status">A iniciar…</div><section id="loginBox" class="card"><h2>Entrar</h2><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Senha</label><input id="password" type="password" required autocomplete="current-password"><button id="loginBtn" type="submit">Entrar no painel</button></form><div id="loginMsg" class="status">Aguardando…</div></section><section id="panel" class="hidden"><div class="card"><h2>Painel desbloqueado</h2><button id="logout" class="secondary">Sair</button></div><div class="card"><h2>Produtos</h2><div id="productList">A carregar…</div></div></section></main><script>(()=>{const URL='https://yjqubmdcidqnodmofywy.supabase.co';const KEY='sb_publishable_wtnoh3Ps8y-_Hw7q4-lp5Q_BfwqTED4';let db;const $=id=>document.getElementById(id);function show(el,msg,kind=''){el.textContent=msg;el.className='status '+kind}function init(){if(!window.supabase)throw Error('A biblioteca do Supabase não carregou.');db=window.supabase.createClient(URL,KEY);show($('boot'),'Supabase carregado. URL válida.','ok')}async function login(e){e.preventDefault();show($('loginMsg'),'Clique recebido. A contactar o Supabase…');$('loginBtn').disabled=true;try{const email=$('email').value.trim(),password=$('password').value;const r=await db.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(!r.data.session)throw Error('Login sem sessão.');$('loginBox').classList.add('hidden');$('panel').classList.remove('hidden');show($('boot'),'Login realizado com sucesso.','ok');await load()}catch(x){show($('loginMsg'),'ERRO: '+(x?.message||String(x)),'err')}finally{$('loginBtn').disabled=false}}async function load(){const r=await db.from('products').select('*').order('created_at',{ascending:false});if(r.error){$('productList').innerHTML='<div class="status err">Erro ao carregar produtos: '+r.error.message+'</div>';return}$('productList').innerHTML=(r.data||[]).length?(r.data||[]).map(p=>'<div style="padding:10px;border-bottom:1px solid #eee"><b>'+String(p.name||'').replace(/[&<>]/g,'')+'</b> — '+Number(p.price||0).toLocaleString('pt-PT')+' Kz</div>').join(''):'Ainda não existem produtos.'} $('loginForm').addEventListener('submit',login);$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};window.addEventListener('error',e=>show($('boot'),'ERRO DE JAVASCRIPT: '+e.message,'err'));(async()=>{try{init();const r=await db.auth.getSession();if(r.error)throw r.error;if(r.data.session){$('loginBox').classList.add('hidden');$('panel').classList.remove('hidden');await load()}else show($('loginMsg'),'Nenhuma sessão ativa. Digite o email e a senha.')}catch(e){show($('boot'),'ERRO AO INICIAR: '+(e?.message||String(e)),'err');show($('loginMsg'),'ERRO AO INICIAR: '+(e?.message||String(e)),'err')}})()})()</script></body></html>
