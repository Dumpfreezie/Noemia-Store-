<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin — Noémia Store</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#f5f6f8;color:#222;margin:0;padding:18px}main{max-width:760px;margin:auto}.card{background:white;padding:18px;border-radius:14px;margin:14px 0;box-shadow:0 2px 12px #0001}input,textarea,button,select{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;font:inherit}button{background:#191919;color:white;border:0;font-weight:bold;cursor:pointer}.secondary{background:#eee;color:#222}.hidden{display:none}.status{padding:12px;border-radius:8px;margin:10px 0;background:#eef2f7}.ok{background:#e8f8ed;color:#176b35}.err{background:#ffe8e8;color:#900}.product{padding:12px;border-bottom:1px solid #eee}.actions{display:flex;gap:8px}.actions button{width:auto;flex:1}</style></head><body><main><h1>Gestor de produtos — Noémia Store</h1><div id="boot" class="status">A iniciar…</div><section id="loginBox" class="card"><h2>Entrar</h2><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Senha</label><input id="password" type="password" required autocomplete="current-password"><button id="loginBtn" type="submit">Entrar no painel</button></form><div id="loginMsg" class="status">Aguardando…</div></section><section id="panel" class="hidden"><div class="card"><h2>Painel desbloqueado</h2><button id="logout" class="secondary">Sair</button></div><div class="card"><h2 id="formTitle">Adicionar produto</h2><form id="productForm"><input id="name" placeholder="Nome do produto" required><input id="price" type="number" min="0" step="0.01" placeholder="Preço (Kz)" required><input id="cat" placeholder="Categoria"><textarea id="desc" rows="4" placeholder="Descrição"></textarea><label for="image">Fotografia do produto (escolher do dispositivo)</label><input id="image" type="file" accept="image/*"><small id="imageHint">Selecione uma imagem do telemóvel ou computador. A imagem anterior será mantida se não escolher outra.</small><img id="imagePreview" class="hidden" alt="Pré-visualização" style="display:block;max-width:180px;max-height:180px;object-fit:contain;margin:10px 0;border-radius:8px"><button id="saveBtn" type="submit">Guardar produto</button><button id="cancelBtn" type="button" class="secondary hidden">Cancelar edição</button></form><div id="formMsg" class="status">Preencha os campos para adicionar um produto.</div></div><div class="card"><h2>Produtos existentes</h2><div id="productList">A carregar…</div></div></section></main><script>(()=>{const URL='https://yjqubmdcidqnodmofywy.supabase.co';const KEY='sb_publishable_wtnoh3Ps8y-_Hw7q4-lp5Q_BfwqTED4';let db,editingId=null,selectedImage='',existingImage='';const $=id=>document.getElementById(id);function msg(id,text,kind=''){const e=$(id);e.textContent=text;e.className='status '+kind}function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function reset(){editingId=null;selectedImage='';existingImage='';$('imagePreview').classList.add('hidden');$('imageHint').textContent='Selecione uma imagem do telemóvel ou computador. A imagem anterior será mantida se não escolher outra.';$('productForm').reset();$('formTitle').textContent='Adicionar produto';$('saveBtn').textContent='Guardar produto';$('cancelBtn').classList.add('hidden');msg('formMsg','Preencha os campos para adicionar um produto.')}async function load(){const r=await db.from('products').select('*').order('created_at',{ascending:false});if(r.error){$('productList').textContent='Erro ao carregar: '+r.error.message;return}const rows=r.data||[];$('productList').innerHTML=rows.length?rows.map(p=>'<div class="product"><b>'+esc(p.name)+'</b> — '+Number(p.price||0).toLocaleString('pt-PT')+' Kz<div class="actions"><button type="button" data-edit="'+esc(p.id)+'">Editar</button></div></div>').join(''):'Ainda não existem produtos.';$('productList').querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>edit(rows.find(p=>String(p.id)===b.dataset.edit))))}function edit(p){if(!p)return;editingId=p.id;$('name').value=p.name||'';$('price').value=p.price??'';$('cat').value=p.category||'';$('desc').value=p.description||'';existingImage=p.image_url||'';selectedImage='';$('imagePreview').classList.toggle('hidden',!existingImage.startsWith('data:image/'));if(existingImage.startsWith('data:image/'))$('imagePreview').src=existingImage;$('imageHint').textContent=existingImage?'Imagem atual mantida se não selecionar outra.':'Escolha uma imagem do dispositivo.';$('formTitle').textContent='Editar produto';$('saveBtn').textContent='Guardar alterações';$('cancelBtn').classList.remove('hidden');msg('formMsg','A editar: '+p.name,'ok');window.scrollTo({top:0,behavior:'smooth'})}$('image').addEventListener('change',async()=>{const file=$('image').files&&$('image').files[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Selecione um ficheiro de imagem.');$('image').value='';return}if(file.size>12*1024*1024){alert('A imagem deve ter menos de 12 MB.');$('image').value='';return}try{const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('Não foi possível ler o ficheiro.'));reader.readAsDataURL(file)});const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error('Ficheiro de imagem inválido.'));im.src=data});const scale=Math.min(1,1200/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);selectedImage=canvas.toDataURL('image/jpeg',0.78);$('imagePreview').src=selectedImage;$('imagePreview').classList.remove('hidden');$('imageHint').textContent='Imagem pronta para guardar ('+Math.round(selectedImage.length/1024)+' KB aproximadamente).'}catch(err){alert('Erro ao preparar imagem: '+err.message)}});async function start(){try{if(!window.supabase)throw Error('Biblioteca Supabase não carregou.');db=window.supabase.createClient(URL,KEY);msg('boot','Supabase carregado.');const s=await db.auth.getSession();if(s.error)throw s.error;if(s.data.session){$('loginBox').classList.add('hidden');$('panel').classList.remove('hidden');await load()}else msg('loginMsg','Introduza as credenciais de administrador.')}catch(e){msg('boot','Erro: '+e.message,'err')}}$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginBtn').disabled=true;try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;$('loginBox').classList.add('hidden');$('panel').classList.remove('hidden');await load()}catch(x){msg('loginMsg','Falha no login: '+x.message,'err')}finally{$('loginBtn').disabled=false}});$('productForm').addEventListener('submit',async e=>{e.preventDefault();$('saveBtn').disabled=true;const p={name:$('name').value.trim(),price:Number($('price').value),category:$('cat').value.trim(),description:$('desc').value.trim(),image_url:selectedImage||existingImage,in_stock:true};try{const r=editingId?await db.from('products').update(p).eq('id',editingId).select('id,name,price').maybeSingle():await db.from('products').insert(p).select('id,name,price').maybeSingle();if(r.error)throw r.error;if(!r.data)throw Error('O Supabase não confirmou nenhuma linha alterada. Verifique as permissões de UPDATE/INSERT (RLS) e tente novamente.');const success=editingId?'Alteração confirmada no banco: '+r.data.name+' — '+Number(r.data.price).toLocaleString('pt-PT')+' Kz.':'Produto criado no banco: '+r.data.name;msg('formMsg',success,'ok');alert(success);reset();await load()}catch(x){msg('formMsg','Não foi possível guardar: '+x.message,'err');alert('Não foi possível guardar: '+x.message)}finally{$('saveBtn').disabled=false}});$('cancelBtn').addEventListener('click',reset);$('logout').addEventListener('click',async()=>{await db.auth.signOut();location.reload()});window.addEventListener('error',e=>msg('boot','Erro de JavaScript: '+e.message,'err'));start()})();</script></body></html>
