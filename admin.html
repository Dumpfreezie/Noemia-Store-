<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin — Noémia Store</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#f5f6f8;color:#222;margin:0;padding:18px}main{max-width:760px;margin:auto}.card{background:white;padding:18px;border-radius:14px;margin:14px 0;box-shadow:0 2px 12px #0001}input,textarea,button,select{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;font:inherit}button{background:#191919;color:white;border:0;font-weight:bold;cursor:pointer}.secondary{background:#eee;color:#222}.hidden{display:none}.status{padding:12px;border-radius:8px;margin:10px 0;background:#eef2f7}.ok{background:#e8f8ed;color:#176b35}.err{background:#ffe8e8;color:#900}.product{padding:12px;border-bottom:1px solid #eee}.actions{display:flex;gap:8px}.actions button{width:auto;flex:1}</style></head><body><main><h1>Gestor de produtos — Noémia Store</h1><div id="boot" class="status">A iniciar…</div><section id="loginBox" class="card"><h2>Entrar</h2><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Senha</label><input id="password" type="password" required autocomplete="current-password"><button id="loginBtn" type="submit">Entrar no painel</button></form><div id="loginMsg" class="status">Aguardando…</div></section><section id="panel" class="hidden"><div class="card"><h2>Painel desbloqueado</h2><button id="logout" class="secondary">Sair</button></div><div class="card"><h2 id="formTitle">Adicionar produto</h2><form id="productForm"><input id="name" placeholder="Nome do produto" required><input id="price" type="number" min="0" step="0.01" placeholder="Preço (Kz)" required><input id="cat" placeholder="Categoria"><textarea id="desc" rows="4" placeholder="Descrição"></textarea><input id="image" type="url" placeholder="URL da imagem (opcional)"><button id="saveBtn" type="submit">Guardar produto</button><button id="cancelBtn" type="button" class="secondary hidden">Cancelar edição</button></form><div id="formMsg" class="status">Preencha os campos para adicionar um produto.</div></div><div class="card"><h2>Produtos existentes</h2><div id="productList">A carregar…</div></div></section></main><script>(()=>{const URL='https://yjqubmdcidqnodmofywy.supabase.co';const KEY='sb_publishable_wtnoh3Ps8y-_Hw7q4-lp5Q_BfwqTED4';let db,editingId=null;const $=id=>document.getElementById(id);function msg(id,text,kind=''){const e=$(id);e.textContent=text;e.className='status '+kind}function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function reset(){editingId=null;$('productForm').reset();$('formTitle').textContent='Adicionar produto';$('saveBtn').textContent='Guardar produto';$('cancelBtn').classList.add('hidden');msg('formMsg','Preencha os campos para adicionar um produto.')}async function load(){const r=await db.from('products').select('*').order('created_at',{ascending:false});if(r.error){$('productList').textContent='Erro ao carregar: '+r.error.message;return}const rows=r.data||[];$('productList').innerHTML=rows.length?rows.map(p=>'<div class="product"><b>'+esc(p.name)+'</b> — '+Number(p.price||0).toLocaleString('pt-PT')+' Kz<div class="actions"><button type="button" data-edit="'+esc(p.id)+'">Editar</button></div></div>').join(''):'Ainda não existem produtos.';$('productList').querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>edit(rows.find(p=>String(p.id)===b.dataset.edit))))}function edit(p){if(!p)return;editingId=p.id;$('name').value=p.name||'';$('price').value=p.price??'';$('cat').value=p.cat||'';$('desc').value=p.desc||'';$('image').value=p.image||'';$('formTitle').textContent='Editar produto';$('saveBtn').textContent='Guardar alterações';$('cancelBtn').classList.remove('hidden');msg('formMsg','A editar: '+p.name,'ok');window.scrollTo({top:0,behavior:'smooth'})}async function start(){try{if(!window.supabase)throw Error('Biblioteca Supabase não carregou.');db=window.supabase.createClient(URL,KEY);msg('boot','Supabase carregado.');const s=await db.auth.getSession();if(s.error)throw s.error;if(s.data.session){$('loginBox').classList.add('hidden');$('panel').classList.remove('hidden');await load()}else msg('loginMsg','Introduza as credenciais de administrador.')}catch(e){msg('boot','Erro: '+e.message,'err')}}$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginBtn').disabled=true;try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;$('loginBox').classList.add('hidden');$('panel').classList.remove('hidden');await load()}catch(x){msg('loginMsg','Falha no login: '+x.message,'err')}finally{$('loginBtn').disabled=false}});$('productForm').addEventListener('submit',async e=>{e.preventDefault();$('saveBtn').disabled=true;const p={name:$('name').value.trim(),price:Number($('price').value),cat:$('cat').value.trim(),desc:$('desc').value.trim(),image:$('image').value.trim()};try{const r=editingId?await db.from('products').update(p).eq('id',editingId):await db.from('products').insert(p);if(r.error)throw r.error;msg('formMsg',editingId?'Produto atualizado com sucesso.':'Produto adicionado com sucesso.','ok');reset();await load()}catch(x){msg('formMsg','Não foi possível guardar: '+x.message,'err')}finally{$('saveBtn').disabled=false}});$('cancelBtn').addEventListener('click',reset);$('logout').addEventListener('click',async()=>{await db.auth.signOut();location.reload()});window.addEventListener('error',e=>msg('boot','Erro de JavaScript: '+e.message,'err'));start()})();</script></body></html>
